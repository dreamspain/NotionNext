[pytest]
# pytest配置文件

# 测试文件和目录
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider

# 标记
markers =
    unit: 单元测试
    integration: 集成测试
    performance: 性能测试
    edge_case: 边界条件测试

# 覆盖率配置
[coverage:run]
source = .
omit = 
    test_*.py
    */__pycache__/*
    */site-packages/*
    .venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
